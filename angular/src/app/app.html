<div class="container">
  <h1>Gestor de Usuarios</h1>

  <p><strong>Favoritos:</strong> {{ favoriteCount() }}</p>

  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Filtrar por nombre..."
  />

  @if (loading()) {
    <p class="loading">Cargando usuarios...</p>
  }

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div>
    @for (user of filteredUsers(); track user.id) {
      <app-user-item
        [user]="user"
        [isFavorite]="favorites().has(user.id)"
        (toggle)="toggleFavorite($event)"
      />
    }
  </div>
</div>
